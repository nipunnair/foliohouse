name: The Open Collection
eyebrow: A FolioHouse demonstration
headline: Art belongs
headlineAccent: in the open.
intro: Waves, water gardens, botanical studies, and moments on film. A small collection of public-domain works, brought together to show what your own portfolio could become.
about: This is a demonstration portfolio, not the work of a single artist. The collection pairs painting, printmaking, and early photography from the Art Institute of Chicago’s open-access collection. Each piece credits its creator and links to its museum record. Build a home for your own work with FolioHouse.
footer: Public-domain art. Open-source software. Your own creative home.
demo: true
